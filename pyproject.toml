[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakhound"
version = "0.2.0"
description = "Sniff out data leakage in your ML train/test split before it fools you."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Joel Gomes" }]
keywords = ["machine-learning", "data-leakage", "validation", "ml-ops", "data-quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pandas>=1.3"]

[project.optional-dependencies]
impact = ["scikit-learn>=1.3"]

[project.scripts]
leakhound = "leakhound.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leakhound"]
